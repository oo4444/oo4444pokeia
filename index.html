<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocketia — jeu de cartes à collectionner</title>
<style>
:root{--bg:#eceaf7;--sf:#fff;--tx:#1b1838;--mt:#6a6788;--ac:#5b3fd0;--bd:#d5d1ea;--F:#e8572f;--O:#2f86dc;--P:#3fa45f;--E:#d09600;--M:#9c6b30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#14122b;--sf:#221f45;--tx:#f0eefc;--mt:#a29fc6;--ac:#8c74ff;--bd:#38346a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{background:radial-gradient(1100px 480px at 85% -10%,#8c74ff26,transparent),radial-gradient(900px 420px at 5% 110%,#2f86dc22,transparent),var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;padding-bottom:92px}

h1{font-size:24px;text-align:center;font-weight:800;letter-spacing:.5px}

.mt{color:var(--mt);font-size:13px;text-align:center;margin:6px 0}
.mt2{color:var(--mt);font-size:12px}
.big{font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -4px 16px #0002}

.btn{display:inline-block;margin:10px auto;padding:12px 28px;border:0;border-radius:999px;background:linear-gradient(160deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent);transition:transform .12s;text-align:center}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.lk{background:none;border:0;color:var(--mt);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;display:block;margin:14px auto 0}
.sbtn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 12px;font:600 13px system-ui;cursor:pointer;transition:transform .12s}
.sbtn:active{transform:scale(.94)}
.sbtn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.sbtn:disabled{opacity:.4;cursor:default}
.chip{background:var(--sf);border:2px solid var(--bd);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}

.foil{width:150px;aspect-ratio:63/100;border-radius:14px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#f2c230,#e8572f 45%,#7b5fe0);box-shadow:0 10px 28px #0005;animation:fl 3s ease-in-out infinite;position:relative;overflow:hidden}

.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sw{position:relative;cursor:pointer;transition:transform .15s}

.cw{container-type:inline-size;width:100%}
.card{aspect-ratio:63/92;border-radius:8cqw;color:#fff;position:relative;overflow:hidden;font-size:6cqw;display:flex;flex-direction:column;gap:2.5cqw;padding:4.5cqw;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 35%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 4px 12px #0004,inset 0 0 0 1.5px #ffffff55;text-shadow:0 1px 2px #0007}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 22% 12%,#fff5,transparent 45%);pointer-events:none}

.h{display:flex;justify-content:space-between;align-items:center;gap:2cqw;font-weight:800;font-size:7.2cqw}

.aks{display:flex;flex-direction:column;gap:1.6cqw}

.rr{text-align:center;letter-spacing:.25em;font-size:6cqw;color:#ffe9a8}
.r4::after,.r5::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#fff8 40%,#8ff5 50%,#f8f6 60%,transparent 80%);background-size:300% 100%;animation:sh 3s linear infinite;mix-blend-mode:overlay;pointer-events:none}

.ph{background:var(--sf);color:var(--mt);border:2px dashed var(--bd);display:grid;place-items:center;font-size:20cqw;box-shadow:none;text-shadow:none}
.x{position:absolute;top:4px;right:4px;background:#000a;color:#fff;border-radius:99px;font-size:12px;padding:0 7px}
.new{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;z-index:2;white-space:nowrap}
.sel .card{outline:3px solid var(--ac);outline-offset:2px}
#ov{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;padding:20px;color:#fff;text-align:center;overflow:auto}
#ov.on{display:flex}
.stage{perspective:900px}
.flip{position:relative;transition:transform .6s;transform-style:preserve-3d;width:min(66vw,250px)}
.flip.on{transform:rotateY(180deg)}
.face{backface-visibility:hidden}
.flip .front{position:absolute;inset:0;transform:rotateY(180deg)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;width:min(100%,420px)}
.log{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:14px;max-height:280px;overflow:auto;margin-top:12px}
.log p{margin:3px 0}
.sets{display:flex;gap:10px;justify-content:center;margin:20px 0 6px}
.sets .foil{width:72px;font-size:28px;animation:none;cursor:pointer;opacity:.5;outline:3px solid transparent;outline-offset:3px}
.tok{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;border:2px solid #fff6;box-shadow:0 2px 6px #0004,inset 0 -3px 5px #0003;flex:none;vertical-align:middle}
.tok.big{width:64px;height:64px;font-size:34px}
.skprev{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px 0}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
.skc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center}
.skc.on{outline:3px solid var(--ac);outline-offset:-3px}
.skc b{font-size:11px}
.skc .mt2{font-size:10px}
.skv{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff6;box-shadow:0 2px 6px #0004,inset 0 -3px 5px #0003}
.pass{text-align:center;padding:70px 16px}
.sets .foil.on{opacity:1;outline-color:var(--ac);animation:fl 3s ease-in-out infinite}
.arena{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px #0002}
.arena .foe{background:linear-gradient(180deg,#e8572f14,#0000 70%);border-radius:12px;padding:4px}
.arena .me{background:linear-gradient(0deg,#5b3fd012,#0000 70%);border-radius:12px;padding:4px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:6px;flex-wrap:wrap}
.turnv{font-size:11px;font-weight:800;color:#fff;background:var(--ac);border-radius:99px;padding:2px 8px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.55}}
.actv{display:flex;justify-content:center}
.pz{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:12px;padding:4px;transition:background .15s,box-shadow .15s}
.pz.tgt{outline:2px dashed var(--ac);outline-offset:-2px;background:color-mix(in srgb,var(--ac) 9%,transparent)}
.pz.em{cursor:default;opacity:.6}
.spr{position:relative;font-size:58px;line-height:1;filter:drop-shadow(0 8px 6px #0003);animation:bob 3.2s ease-in-out infinite;z-index:1}
.spr::after{content:"";position:absolute;left:50%;bottom:-12px;width:74px;height:13px;transform:translateX(-50%);background:radial-gradient(ellipse,#0003,#0000 70%);z-index:-1}
.spr.em{font-size:28px;opacity:.35;animation:none}
.spr.hit{animation:hit .55s}
.pz.ko .spr{animation:ko .75s forwards}
.pz.lgU .spr{animation:lgU .55s}
.pz.lgD .spr{animation:lgD .55s}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hit{0%,100%{transform:none}15%{transform:translateX(-9px);filter:brightness(2.2) saturate(.2) drop-shadow(0 0 14px #f003)}35%{transform:translateX(9px)}55%{transform:translateX(-6px);filter:brightness(1.7)}75%{transform:translateX(5px)}}
@keyframes ko{to{transform:translateY(30px) rotate(80deg);opacity:0}}
@keyframes lgU{30%{transform:translateY(24px) scale(1.06)}}
@keyframes lgD{30%{transform:translateY(-24px) scale(1.06)}}
.inf{width:100%;background:#00000010;border-radius:10px;padding:6px 8px;font-size:12px;color:var(--tx);text-shadow:none}
.inf.em{text-align:center;color:var(--mt)}
.inf .nm{font-weight:800;display:flex;gap:5px;align-items:center;font-size:13px}
.inf .nm .rr2{margin-left:auto;letter-spacing:.15em;color:#b08a2e;font-size:11px}
.hpb{position:relative;height:11px;background:#00000028;border-radius:99px;margin:4px 0;overflow:hidden}
.hpb i{display:block;height:100%;border-radius:99px;background:#43d17c;transition:width .5s,background .5s}
.hpb i.mid{background:#f2a93b}.hpb i.low{background:#e5484d}
.hpb span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:11px;color:#fff;text-shadow:0 1px 2px #0009;font-weight:700}
.pips{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.pips .lb{font-size:10px;color:var(--mt);margin-right:2px}
.ep{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-style:normal;color:#fff;box-shadow:inset 0 -2px 3px #0004,0 1px 3px #0003}
.ep.F{background:#e8572f}.ep.O{background:#2f86dc}.ep.P{background:#3fa45f}.ep.E{background:#d09600}
.ep.no{background:#00000015;color:var(--mt);box-shadow:none}
.sts{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.sts em{font-style:normal;font-size:10px;font-weight:700;background:#00000022;border-radius:99px;padding:1px 7px;animation:blink 1.6s infinite}
.sts em.bf{background:#e8572f33}.sts em.pf{background:#7b5fe033}.sts em.paf{background:#d0960033}.sts em.df{background:#2f86dc33}.sts em.af{background:#3fa45f33}
.bnr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#00000008;border:1px dashed var(--bd);border-radius:10px;padding:4px;cursor:pointer;min-height:60px;gap:2px;transition:background .15s}
.mini.tgt{outline:2px dashed var(--ac);background:color-mix(in srgb,var(--ac) 9%,transparent)}
.mini .spr{font-size:28px}
.mini .mh{font-size:9px;color:var(--mt);font-weight:600}
.mini .mst{font-size:9px}
.msg{min-height:40px;text-align:center;font-size:13.5px;font-weight:700;color:#fff;background:linear-gradient(160deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));border-radius:12px;padding:9px 10px;box-shadow:0 3px 10px #0002;margin:0 2px}
.hd{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;min-height:96px}
.pc{position:relative;flex:0 0 86px;border-radius:10px;padding:6px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;font-size:11px;min-height:86px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-shadow:0 1px 2px #0006;overflow:hidden;text-align:center;box-shadow:0 3px 8px #0003;transition:transform .12s}
.pc:active{transform:scale(.95)}
.pc>span{font-size:26px;line-height:1}
.pc b{font-size:11px;line-height:1.15}
.pc i{display:block;height:5px;background:#7dff9a;border-radius:3px;align-self:flex-start}
.pc.itc{background:linear-gradient(150deg,#d9b45c,#8a6a1f)}
.pc.itc u{text-decoration:none;font-size:9px;opacity:.85}
.pc.em{background:none;border:2px dashed var(--bd);cursor:default;box-shadow:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.atk{display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px 6px;margin:0;border-radius:14px}
.atk small{font-weight:500;font-size:10.5px;opacity:.92;line-height:1.3}
.wide{grid-column:1/-1;display:flex;justify-content:center;gap:10px;align-items:center}
.flt{position:fixed;transform:translateX(-50%);font-weight:800;font-size:22px;z-index:99;animation:fup 1.1s forwards;pointer-events:none;text-shadow:0 2px 6px #0008}
.flt.dmg{color:#ff5544}
.flt.wk{color:#ffd23f;font-size:27px}
.flt.heal{color:#5dff8f}
.flt.fx{color:#d29bff;font-size:15px}
@keyframes fup{from{opacity:0;transform:translate(-50%,12px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-64px)}}
.dbar{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:10px;flex-wrap:wrap;box-shadow:0 3px 10px #0001}
.dbar b{font-size:18px}
.dbar b.ok{color:#2f9e5c}.dbar b.no{color:#c43d3d}
.dbar .sp{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.dkc{position:relative;padding-bottom:14px}
.qtl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:2px 7px;box-shadow:0 2px 8px #0003;z-index:2}
.qtl button{border:0;background:var(--ac);color:#fff;width:21px;height:21px;border-radius:50%;font-weight:800;cursor:pointer;line-height:1;font-size:14px}
.qtl b{min-width:14px;text-align:center;font-size:12px}
.itv{background:var(--sf);color:var(--tx);border-radius:14px;padding:16px 20px;max-width:300px;box-shadow:0 8px 24px #0004}
.itv span{font-size:40px;display:block}
.itv img.tiv{width:100%;height:110px;object-fit:cover;border-radius:10px;display:block;margin-bottom:8px}
.itv b{font-size:17px}
.itv p{font-size:13px;color:var(--mt);margin-top:4px}
#coinfx{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:10px;z-index:50;background:#0009;pointer-events:none}
.cin{font-size:90px;animation:csp .45s linear 2;text-shadow:0 6px 20px #0008}
@keyframes csp{to{transform:rotateY(720deg)}}
.ct{color:#fff;font-weight:800;font-size:18px;letter-spacing:.05em;text-shadow:0 2px 8px #000}
.rls{background:var(--sf);color:var(--tx);border-radius:14px;padding:16px 18px;max-width:430px;text-align:left;font-size:13px;box-shadow:0 10px 30px #0006}
.rls h2{margin-bottom:8px}
.rls p{margin:7px 0;line-height:1.45}
#tst{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20;white-space:nowrap}
#tst.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<main></main>
<div id="ov"></div>
<div id="tst"></div>
<nav>
<button data-t="pk"><b>🎴</b>Boosters</button>
<button data-t="co"><b>📚</b>Collection</button>
<button data-t="dk"><b>🛠️</b>Deck</button>
<button data-t="sk"><b>🎨</b>Skins</button>
<button data-t="du"><b>⚔️</b>Duel</button>
</nav>
<script>
const T={F:"Flamme",O:"Onde",P:"Feuille",E:"Éclair",M:"Minéral"},TY=["F","O","P","E","M"];
const EN={F:"🔥",O:"💧",P:"🍃",E:"⚡",M:"🪨"},WK={F:"O",O:"P",P:"F",E:"P",M:"O"};

 show(`<div class="foil" id="f" style="width:190px;touch-action:none;background:${SB(ty)}">${EN[ty]}</div><p>Fais glisser ton doigt sur le haut du booster pour le découper</p>`);
 const f=$("#f");let x0=null,y0=0;
 f.onpointerdown=e=>{if(e.clientY-f.getBoundingClientRect().top<f.offsetHeight*.35){x0=e.clientX;y0=e.clientY}};
 f.onpointermove=e=>{if(x0!==null&&Math.abs(e.clientX-x0)>90&&Math.abs(e.clientY-y0)<50){x0=null;f.classList.add("rip");setTimeout(()=>rev(0),600)}};
 function rev(i){
  if(i>=cs.length)return sum();let on=0;
  show(`<div class="stage"><div class="flip" id="fl"><div class="cw face"><div class="card back">✦</div></div><div class="front face">${card(cs[i])}${nw[i]?'<span class="new">NOUVELLE CARTE</span>':""}</div></div></div><p id="hn">Touche pour révéler (${i+1}/${cs.length})</p>`,()=>{if(!on){on=1;$("#fl").classList.add("on");$("#hn").textContent=i<cs.length-1?"Touche pour continuer":"Touche pour voir le résumé"}else rev(i+1)})
 }
 function sum(){show(`<h2>Ton tirage</h2><div class="sum">${cs.map((c,i)=>`<div class="sw">${card(c)}${nw[i]?'<span class="new">NEW</span>':""}</div>`).join("")}</div><button class="btn" onclick="hide()">Terminer</button>`)}
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();setInterval(tick,1000);
</script>
</body>
