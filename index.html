  else{const it=e.it;show(`<div class="itv"><span>${it.e}</span><b>${it.n}</b><p>${it.d}</p></div><button class="btn" id="ui">Utiliser</button><button class="lk" id="uc">Annuler</button>`);
   $("#ui").onclick=()=>{p.hd.splice(i,1);
    if(it.k=="draw"){for(let k=0;k<2&&p.dk.length;k++)p.hd.push(p.dk.pop());G.m="📜 Tu pioches 2 cartes."}
    else if(it.k=="retreat"){p.free=true;G.m="🌀 Repli gratuit : clique une créature du banc."}
    else G.pend=it;
    hide()};
   $("#uc").onclick=hide}});
 const ez=$("#ez");if(ez)ez.onclick=()=>{if(!my||!p.ez||p.at)return;G.es=!G.es;G.m=G.es?"Clique une de tes créatures pour attacher l’énergie.":"Action annulée.";board()};
 const cc=$("#cc");if(cc)cc.onclick=()=>{G.pend=null;G.es=0;G.m="Action annulée.";board()};
 m.querySelectorAll("[data-z]").forEach(el=>el.onclick=()=>{const k=el.dataset.z;if(k=="x")return;
  const t=k=="a"?p.ac:p.bn[+k[1]];if(!t)return;
  if(G.pr&&k!="a"){p.ac=p.bn.splice(+k[1],1)[0];G.pr=0;G.m=`${p.ac.c.n} entre en jeu !`;endTurn();return board()}
  if(!my)return;
  if(G.pend){applyPend(k,t);return}
  if(G.es&&p.ez&&!p.at){t.en.push(p.ez);p.ez=null;p.at=1;G.es=0;sHeal();G.m="Énergie attachée.";}
  else if(k!="a"){
   if(p.free){[p.ac,p.bn[+k[1]]]=[t,p.ac];p.free=false;G.m="Repli gratuit effectué."}
   else{const r=RT[p.ac.c.r-1];if(p.ac.en.length>=r){p.ac.en.splice(0,r);[p.ac,p.bn[+k[1]]]=[t,p.ac];G.m="Retraite effectuée."}else G.m=`Retraite : ${r} énergie(s) requise(s) sur l’actif.`}}
  board()});
 m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(!my)return;atk(0,+b.dataset.k)});
 const ps=$("#ps");if(ps)ps.onclick=()=>{if(!my)return;G.m="Tu passes ton tour.";endTurn();board()};
 const rl=$("#rl");if(rl)rl.onclick=rules}
function dkTot(){return S.dk.c.reduce((a,e)=>a+e[1],0)+S.dk.it.reduce((a,e)=>a+e[1],0)}
function dkCre(){return S.dk.c.reduce((a,e)=>a+e[1],0)}
function dkAdd(t,id,d){const arr=t=="c"?S.dk.c:S.dk.it;let e=arr.find(x=>x[0]==id);
 if(d>0){if(dkTot()>=20){toast("Deck plein (20 cartes)");return}
  if(e&&e[1]>=MAXQ){toast("Max "+MAXQ+" exemplaires");return}
  if(t=="c"&&e&&e[1]>=S.o[id]){toast("Tu ne possèdes que "+S.o[id]+" exemplaire(s)");return}
  if(e)e[1]++;else arr.push([id,1])}
 else{if(!e)return;e[1]--;if(e[1]<=0)arr.splice(arr.indexOf(e),1)}
 render()}
function dkTab(){const m=$("main");if(!S.dk)S.dk={c:[],it:[]};
 const tot=dkTot(),cre=dkCre(),valid=tot==20&&cre>=MINC;
 const qi=id=>{const e=S.dk.it.find(x=>x[0]==id);return e?e[1]:0};
 const q=id=>{const e=S.dk.c.find(x=>x[0]==id);return e?e[1]:0};
 const chips=[["T","Tous"],["F","🔥 Flamme"],["O","💧 Onde"],["P","🍃 Feuille"],["E","⚡ Éclair"],["Y","👻 Yokai"],["I","🎒 Objets"]];
 const own2=C.filter(c=>S.o[c.id]);
 const list=FIL=="T"?own2:FIL=="Y"?own2.filter(c=>c.set=="yo"):own2.filter(c=>c.t==FIL);
 m.innerHTML=`<h1>Créateur de deck</h1><p class="mt">20 cartes exactement · ${MINC} créatures minimum · ${MAXQ} exemplaires max par carte</p>
 <div class="dbar"><b class="${valid?"ok":"no"}">${tot}/20</b><span class="mt2">créatures ${cre} · objets ${tot-cre}</span><span class="sp"></span><button class="sbtn" id="au">Auto</button><button class="sbtn" id="vd">Vider</button><button class="sbtn pri" id="sv" ${valid?"":"disabled"}>Enregistrer</button></div>
 <div class="chips">${chips.map(([k,l])=>`<span class="chip${FIL==k?" on":""}" data-f="${k}">${l}</span>`).join("")}</div>
 ${FIL=="I"
  ?`<div class="g">${IT.map(it=>`<div class="dkc">${itemCard(it)}<div class="qtl"><button data-a="+" data-t="it" data-id="${it.id}">+</button><b>${qi(it.id)}</b><button data-a="−" data-t="it" data-id="${it.id}">−</button></div></div>`).join("")}</div>`
  :list.length?`<div class="g">${list.map(c=>`<div class="dkc"><div class="sw">${card(c)}</div><div class="qtl"><button data-a="+" data-t="c" data-id="${c.id}">+</button><b>${q(c.id)}</b><button data-a="−" data-t="c" data-id="${c.id}">−</button></div></div>`).join("")}</div>`:`<p class="mt">Aucune créature de ce type. Ouvre des boosters !</p>`}
 <p class="mt">${valid?"✅ Deck valide ! Enregistre-le pour l’utiliser en duel.":tot>20?"Trop de cartes : retire-en.":tot<20?"Ajoute des cartes pour atteindre 20.":"Il faut au moins "+MINC+" créatures."}</p>`;
 m.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{FIL=el.dataset.f;render()});
 m.querySelectorAll(".qtl button").forEach(el=>el.onclick=()=>dkAdd(el.dataset.t,+el.dataset.id,el.dataset.a=="+"?1:-1));
 $("#vd").onclick=()=>{S.dk={c:[],it:[]};render()};
 $("#au").onclick=()=>{S.dk={c:[],it:[]};
  const o2=C.filter(c=>S.o[c.id]).sort((a,b)=>b.r-a.r||b.h-a.h);
  o2.forEach(c=>{if(dkTot()<=12)S.dk.c.push([c.id,2])});
  [[0,2],[5,2]].forEach(([id,n])=>{if(dkTot()+n<=20)S.dk.it.push([id,n])});
  for(const c of o2){while(dkTot()<20){const e=S.dk.c.find(x=>x[0]==c.id);if(e&&e[1]<MAXQ)e[1]++;else if(!e&&dkTot()<20)S.dk.c.push([c.id,1]);else break}}
  render()};
 $("#sv").onclick=()=>{if(!valid)return;save();toast("Deck enregistré !")}}
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 const m=$("main");
 if(tab=="pk"){
  m.innerHTML=`<h1>Pocketia</h1><p class="mt">Ouvre des boosters, complète ta collection de ${C.length} créatures, construis ton deck et duelle.</p><div class="sets">${TY.map(t=>`<div class="foil${SET==t?" on":""}" data-s="${t}" style="background:${SB(t)}">${EN[t]}</div>`).join("")}</div><p class="mt">Booster ${T[SET]} : ${SET=="Y"?"48 yokai de ton tableau":"plus de cartes "+T[SET]}</p><p class="mt">Boosters : <b id="pk"></b>/${MAX} — <span id="tm"></span></p><button class="btn" id="op">Ouvrir un booster</button><p class="mt">Un booster offert toutes les 90 secondes. Chaque victoire en duel en rapporte un de plus.</p><p class="mt">Cartes uniques : ${own().length}/${C.length} · Boosters ouverts : ${S.n} · Victoires : ${S.w} <button class="sbtn" id="mu">${S.m?"🔇":"🔊"}</button></p>`;
  m.querySelectorAll("[data-s]").forEach(d=>d.onclick=()=>{SET=d.dataset.s;render()});
  $("#op").onclick=()=>openPack(SET);
  $("#mu").onclick=()=>{S.m=S.m?0:1;save();render()};
 }else if(tab=="co"){
  m.innerHTML=`<h1>Collection</h1><p class="mt">${own().length} / ${C.length} créatures · touche une carte pour les détails</p><div class="g">${C.map(c=>S.o[c.id]?`<div class="sw" data-i="${c.id}">${card(c)}${S.o[c.id]>1?`<span class="x">×${S.o[c.id]}</span>`:""}</div>`:`<div class="cw"><div class="card ph">?</div></div>`).join("")}</div><button class="lk" id="rs">Réinitialiser la partie</button>`;
  m.querySelectorAll("[data-i]").forEach(d=>d.onclick=()=>{const c=C[d.dataset.i];show(`<div style="width:min(75vw,300px)">${card(c)}</div><p>${T[c.t]} · faible contre ${T[WK[c.t]]}</p><p>${c.ak.map(a=>`<b>${a.n}</b> (⚡${a.cost}) : ${atkTxt(a)}`).join("<br>")}</p><p>Touche pour fermer</p>`,hide)});
  $("#rs").onclick=e=>{if(!e.target.dataset.s){e.target.dataset.s=1;e.target.textContent="Clique encore pour tout effacer"}else{S={p:3,t:Date.now(),o:{},w:0,n:0,dk:null,m:0};save();render()}};
 }else if(tab=="dk"){dkTab();return}else{battle()}
 tick()}
function regen(){const n=Date.now();if(S.p>=MAX){S.t=n;return}const g=Math.floor((n-S.t)/INT);if(g>0){S.p=Math.min(MAX,S.p+g);S.t=S.p>=MAX?n:S.t+g*INT;save()}}
function tick(){regen();const a=$("#pk");if(!a)return;a.textContent=S.p;$("#op").disabled=S.p<1;const l=Math.max(0,INT-(Date.now()-S.t));$("#tm").textContent=S.p>=MAX?"stock plein":"prochain dans "+Math.ceil(l/1000)+" s"}
const SB=t=>({F:"linear-gradient(135deg,#ffb36b,#e8572f,#7a1d12)",O:"linear-gradient(135deg,#8fe0ff,#2f86dc,#12306e)",P:"linear-gradient(135deg,#b8f08a,#3fa45f,#0f4a2a)",E:"linear-gradient(135deg,#fff08a,#d09600,#6a4a00)",Y:"linear-gradient(135deg,#b39ddb,#5e35b1,#1a0058)"})[t];
function roll(w,ty,set){let x=Math.random()*w.reduce((a,b)=>a+b),r=0;while(r<4&&(x-=w[r])>=0)r++;let p=C.filter(c=>c.r==r+1&&(c.set||"pk")==set),q=ty&&Math.random()<.6?p.filter(c=>c.t==ty):[];if(q.length)p=q;return p[Math.floor(Math.random()*p.length)]}
function show(h,f){ov.innerHTML=h;ov.classList.add("on");st=f||null}
function hide(){ov.classList.remove("on");st=null;render()}
ov.onclick=e=>{if(!e.target.closest("button")&&st)st()};
function openPack(ty){
 if(S.p<1)return;if(S.p>=MAX)S.t=Date.now();S.p--;S.n++;
 const W=[[58,26,10,4.5,1.5],[0,60,28,9,3]];
 const cs=[0,0,0,0,1].map(i=>roll(W[i],ty=="Y"?null:ty,ty=="Y"?"yo":"pk")),nw=cs.map(c=>{const n=!S.o[c.id];S.o[c.id]=(S.o[c.id]||0)+1;return n});save();
 show(`<div class="foil" id="f" style="width:190px;touch-action:none;background:${SB(ty)}">${EN[ty]}</div><p>Fais glisser ton doigt sur le haut du booster pour le découper</p>`);
 const f=$("#f");let x0=null,y0=0;
 f.onpointerdown=e=>{if(e.clientY-f.getBoundingClientRect().top<f.offsetHeight*.35){x0=e.clientX;y0=e.clientY}};
 f.onpointermove=e=>{if(x0!==null&&Math.abs(e.clientX-x0)>90&&Math.abs(e.clientY-y0)<50){x0=null;f.classList.add("rip");setTimeout(()=>rev(0),600)}};
 function rev(i){
  if(i>=cs.length)return sum();let on=0;
  show(`<div class="stage"><div class="flip" id="fl"><div class="cw face"><div class="card back">✦</div></div><div class="front face">${card(cs[i])}${nw[i]?'<span class="new">NOUVELLE CARTE</span>':""}</div></div></div><p id="hn">Touche pour révéler (${i+1}/${cs.length})</p>`,()=>{if(!on){on=1;$("#fl").classList.add("on");$("#hn").textContent=i<cs.length-1?"Touche pour continuer":"Touche pour voir le résumé"}else rev(i+1)})
 }
 function sum(){show(`<h2>Ton tirage</h2><div class="sum">${cs.map((c,i)=>`<div class="sw">${card(c)}${nw[i]?'<span class="new">NEW</span>':""}</div>`).join("")}</div><button class="btn" onclick="hide()">Terminer</button>`)}
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();setInterval(tick,1000);
</script>
